name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension Control version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: sap_release
    attributes:
      label: SAP release
      placeholder: S/4HANA 2023 FPS02
    validations:
      required: true
  - type: input
    id: abapgit
    attributes:
      label: abapGit version
      placeholder: 1.131.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include short dump ID (ST22) or error message if available. Remove customer data.
    validations:
      required: true
